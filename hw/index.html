<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WindyGI HW Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Fork of the WindyGI SW sheet (report-sw-final/template.html): the same dark light-table, one map, a tier switch, four verdict tiles
   (one per tier, the picked one outlined), one big comparison viewer, a filmstrip, then the ledger of the picked tier with a second view
   of the GPU / CPU split, and the measurement notes. Single dark theme on purpose: images are judged on a neutral dark ground. */
:root {
  --ground: #101316;      /* page */
  --panel: #171c21;       /* raised surfaces */
  --line: #2a3139;        /* hairlines */
  --ink: #e7eaec;         /* text */
  --muted: #98a2ab;       /* secondary text */
  --sun: #f0a640;         /* accent: the daylight that is being bounced */
  --faster: #52c7a0;      /* WindyGI faster */
  --slower: #ee7269;      /* WindyGI slower */
  --cpu: #8fb3ff;         /* CPU-bound marker */
  --display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font: 16px/1.5 var(--body); margin: 0; }
.wrap { max-width: 1680px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 64px; display: grid; gap: 40px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .01em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 4vw, 48px); line-height: 1.05; }
h2 { font-size: 26px; }
h3 { font-size: 18px; color: var(--muted); font-weight: 500; }
p { margin: 0; max-width: 76ch; }
.eyebrow { font: 500 12px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--sun); }
.banner { border: 1px dashed var(--sun); color: var(--sun); border-radius: 6px; padding: 10px 14px; font: 600 15px var(--body); }
.muted { color: var(--muted); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
header { display: grid; gap: 14px; }
.pickers { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--ground); padding-block: 8px; }
.pickers .lbl { font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.rig { font-size: 14px; color: var(--muted); margin: 0; }
.rig b { color: var(--ink); font-weight: 600; }
.verdicts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.verdict { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0;
  text-align: left; color: inherit; font: inherit; cursor: pointer; }
.verdict[aria-pressed="true"] { border-color: var(--sun); box-shadow: inset 0 -2px 0 var(--sun); }
.verdict:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
.verdict .big { font: 600 28px/1.1 var(--display); }
.verdict .big.good { color: var(--faster); }
.verdict .big.bad { color: var(--slower); }
.verdict .fps { font: 500 14px var(--mono); }
.verdict .small { font-size: 14px; color: var(--muted); }

/* viewer */
.viewer { display: grid; gap: 12px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: transparent; color: var(--muted); border: 0; padding: 7px 12px; font: 600 14px var(--body); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: inset 0 -2px 0 var(--sun); }
.seg button:focus-visible, select:focus-visible, .thumb:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
label.pick { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: 14px var(--body); max-width: 100%; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: 6px; overflow: hidden; user-select: none; touch-action: pan-y; }
.stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.stage .top { clip-path: inset(0 0 0 var(--cut, 50%)); }
.stage .handle { position: absolute; top: 0; bottom: 0; left: var(--cut, 50%); width: 2px; background: var(--sun); transform: translateX(-1px); pointer-events: none; }
.stage .handle::after { content: ""; position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--sun); background: rgba(16,19,22,.6); transform: translate(-50%, -50%); }
/* corner labels as in TechPowerUp's comparisons: the source, then its FPS / frame time and GI cost on this view (the 4K kit) */
.stage .tag { position: absolute; top: 10px; display: grid; gap: 1px; max-width: 46%; background: rgba(16,19,22,.78); padding: 5px 10px 6px; border-radius: 4px; pointer-events: none; }
.stage .tag .t1 { font: 600 15px/1.2 var(--display); letter-spacing: .04em; }
.stage .tag .t2 { font: 500 13px/1.3 var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.stage .tag .t2 b { color: var(--sun); font-weight: 600; }
.stage .tag .t3 { font: 400 12px/1.3 var(--mono); color: var(--muted); }
.stage .tag.l { left: 10px; } .stage .tag.r { right: 10px; text-align: right; }
.stage input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
.stage .missing { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; text-align: center; padding: 16px; }
.readout { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 15px; }
.readout b { font-weight: 600; }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.thumb { position: relative; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; background: #000; padding: 0; cursor: pointer; aspect-ratio: 16 / 9; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .82; }
.thumb span { position: absolute; left: 5px; bottom: 4px; font: 500 12px var(--mono); background: rgba(16,19,22,.75); padding: 1px 5px; border-radius: 3px; color: var(--ink); }
.thumb[aria-current="true"] { border-color: var(--sun); }
.thumb[aria-current="true"] img { opacity: 1; }
.thumb .pt { position: absolute; right: 5px; top: 4px; font: 600 10px var(--mono); color: var(--ground); background: var(--sun); padding: 0 4px; border-radius: 3px; }
.chip { display: inline-block; font: 600 11px var(--mono); color: var(--ground); background: var(--cpu); padding: 0 5px; border-radius: 3px; vertical-align: 1px; }

/* ledger */
.ledhead { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: baseline; justify-content: space-between; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; min-width: 860px; font-size: 14px; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 600 13px var(--body); color: var(--muted); background: var(--panel); }
thead tr:first-child th { color: var(--ink); text-align: center; border-bottom: 0; }
th.grp, td.grp { border-left: 1px solid var(--line); }
td:first-child, th:first-child { text-align: left; }
td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
tr.sum td { font-weight: 500; background: var(--panel); }
.delta { display: inline-grid; grid-template-columns: 58px 60px; align-items: center; gap: 6px; }
.bar { height: 8px; position: relative; background: var(--line); border-radius: 2px; }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.good { color: var(--faster); } .bad { color: var(--slower); }
.pending { padding: 18px; color: var(--muted); }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px 28px; }
.notes ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.notes li { max-width: 70ch; }
code { font: 13px var(--mono); background: var(--panel); padding: 1px 5px; border-radius: 3px; }
section { display: grid; gap: 14px; min-width: 0; }
footer { color: var(--muted); font-size: 13px; }
@media (max-width: 640px) { .wrap { padding-inline: 16px; } .stage .tag { top: 6px; padding: 3px 6px 4px; } .stage .tag.l { left: 6px; } .stage .tag.r { right: 6px; }
  .stage .tag .t1 { font-size: 12px; } .stage .tag .t2 { font-size: 11px; } .stage .tag .t3 { display: none; } .verdict .big { font-size: 24px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
<header>
  <div class="banner" id="banner" hidden></div>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="h1"></h1>
  <p class="muted" id="lead"></p>
</header>

<div class="pickers" role="group" aria-label="Map, tier and GPU">
  <span class="lbl">Map</span>
  <div class="seg" id="maps"></div>
  <span class="lbl">Tier</span>
  <div class="seg" id="tiers"></div>
  <span class="lbl">GPU</span>
  <div class="seg" id="gpus"></div>
</div>

<p class="rig" id="rig"></p>

<div class="verdicts" id="verdicts" aria-live="polite"></div>

<section class="viewer" aria-label="Image comparison">
  <div class="controls">
    <div class="seg" role="group" aria-label="Exposure">
      <button id="m-pt" type="button">Fixed EV · with the path tracer</button>
      <button id="m-play" type="button">As played · auto exposure</button>
    </div>
    <label class="pick">Left <select id="left"></select></label>
    <label class="pick">Right <select id="right"></select></label>
  </div>
  <div class="stage" id="stage">
    <img id="imgL" alt="">
    <img id="imgR" class="top" alt="">
    <div class="handle"></div>
    <div class="tag l" id="tagL"></div>
    <div class="tag r" id="tagR"></div>
    <div class="missing" id="missing" hidden>No image for this combination yet</div>
    <input type="range" id="cut" min="0" max="100" value="50" step="0.1" aria-label="Comparison divider">
  </div>
  <div class="readout" id="readout"></div>
  <div class="strip" id="strip" role="list"></div>
  <p class="muted" id="howto"></p>
</section>

<section aria-labelledby="h-ledger">
  <div class="ledhead">
    <h2 id="h-ledger"></h2>
    <div class="seg" role="group" aria-label="Ledger columns">
      <button id="t-ft" type="button">Frame time · GI cost</button>
      <button id="t-gpu" type="button">GPU · CPU threads</button>
    </div>
  </div>
  <p class="muted" id="ledger-lead"></p>
  <div class="tablewrap" id="ledger"></div>
</section>

<section aria-labelledby="h-how">
  <h2 id="h-how">How it was measured</h2>
  <div class="notes" id="notes"></div>
</section>

<footer id="foot"></footer>
</div>

or the light in the tent. Build: RT_88TG (4.27-Soliz 0cee8223).", "tierNotes": {"low": "Lumen Low has no GI at all, so Δ is WindyGI Low's whole frame against a UE 5.8 frame without GI; WindyGI's own GI cost (against its GI-off frame) is the GI cost column.", "med": "WindyGI Medium (route B, the world probe volume) against Lumen Medium with hardware ray tracing.", "high": "WindyGI High (the irradiance cache) against Lumen High with hardware ray tracing.", "epic": "WindyGI Epic against Lumen Epic with hardware ray tracing."}, "verdictNotes": {"low": "", "med": "", "high": "", "epic": ""}, "labels": {"W": "WindyGI HW", "L": "Lumen HWRT", "PT": "Path tracer (UE 5.8)"}, "notes": [{"h": "Machines and builds", "items": ["RX 9070 XT: Ryzen 9 7940HX (16C / 32T), 64 GB DDR5-4800, Radeon RX 9070 XT 16 GB, Windows 11, 3840x2160 native fullscreen.", "RTX 5090: 13th Gen Intel Core i9-13900KF (24C / 32T), 96 GB DDR5-4000, GeForce RTX 5090 32 GB, Windows 11, 3840x2160 native fullscreen.", "RTX 3070: Xeon CPU E5-2696 v3 @ 2.30GHz (18C / 36T), 128 GB DDR3-1600, GeForce RTX 3070 8 GB, Windows 11, 3840x2160 offscreen.", "RTX 2080 Ti 22 GB: Xeon CPU E5-2696 v4 @ 2.20GHz (22C / 44T), 128 GB DDR3-1866, GeForce RTX 2080 Ti 22 GB, Windows 11, 3840x2160 offscreen.", "Radeon 680M: Ryzen 7 6800U (8C / 16T), 16 GB LPDDR5-6400, Radeon 680M, sharing the RAM, Windows 11, 1280x720 native fullscreen.", "WindyGI HW: packaged Development build RT_88TG of the UE 4.27 project UpscalerTest (4.27-Soliz 0cee8223; branch 4.27-Soliz at 0cee8223) on Map_RT_Daylight. TestGIMap: RT_88TGm, the same code cooked with the SW project's TestGIMap (the HW project's copy of the map had lost part of its screen-space reflection load, which made it look cheaper than it is); on the Radeon 680M RT_92, which adds the ArrivalBoost kick on a tier change (in 4.27-Soliz since 1795aeff).", "Lumen: packaged Development build Lumen_1006b of the UE 5.8 project GITest58, cooked with hardware ray tracing.", "TestGIMap is measured on the SW sheet's 10 views. Measured again on 2026-10-09: the first TestGIMap runs loaded the map as a spectator, where the capture plugin can turn the camera but not move it, so every view was taken from the spawn point.", "All runs of 2026-10-08/09: the game at Normal priority on an otherwise idle machine, no remote-desktop stream during a measured process. RTX 2080 Ti 22 GB: the only card in its machine. Radeon 680M: 12 of the 24 Map_RT_Daylight views, on AC.", "The 1920x1080 images are offscreen captures of the packages and views on an RTX 3070, an image does not depend on the GPU. Map_RT_Daylight: WindyGI from HWFIN86 on RT_86 (aa99779c; the later r.WindyGI.Async.UpdateLast of RT_88 changes the order of the work, not the image: per pixel under the A/A floor), Lumen from HWFIN on Lumen_1006b, as played and at fixed exposures. TestGIMap (added 2026-10-09): WindyGI on RT_88TGm, Lumen on Lumen_1006b, as played only, 46 s on the first view and 20 s on each view."]}, {"h": "Matched between the engines", "items": ["TAA at 100 % screen percentage, no upscaler, FSR4 and frame generation off, VSync off, no frame cap.", "Fog off (ShowFlag.Fog 0); motion blur off.", "UE 5.8 shadows set to UE 4.27's values: r.Shadow.CSM.MaxCascades 3 on Map_RT_Daylight and 8 on TestGIMap (both lights render 4 there in both engines), DistanceScale 0.85, RadiusThreshold 0.02, CSM.TransitionScale 0.8, PreShadowResolutionFactor 0.5, MaxResolution and MaxCSMResolution 2048, virtual shadow maps off.", "UE 5.8 volumetric fog grid at UE 4.27's values (GridPixelSize 16, GridSizeZ 64); software VRS off; r.DetailMode 2.", "No SSAO in either engine (r.AmbientOcclusionLevels 0); distance-field AO as each tier sets it. Static lighting off in both projects.", "Lumen reflections off, screen-space reflections at quality 3 from full-resolution scene colour in both (r.SSR.HalfResSceneColor 0; UE 5.8's Medium and High reflection tiers would halve it). Lumen async compute on; WindyGI's async at its shipped default.", "Local exposure 0.8 / 0.8 in both (UE 4.27's MiddleGreyBias 0), bloom 5, eye adaptation quality 2, as the SW sheet. UE 4.27 reads the atmosphere sun as UE 5 does (r.SkyAtmosphere.SunIlluminanceOuterSpace 1).", "The same camera poses in both, visited in the same order; UE 5.8 takes the FOV converted from UE 4.27's horizontal FOV, which gives the same framing (the poses and FOVs are the ones the HW session pixel-matched against the SW sheet's FINLM and PTF shots)."]}, {"h": "Tiers", "items": ["WindyGI: r.WindyGI.Preset 1, hardware ray tracing on, r.WindyGI.Intensity 1.2 from the project; the tier is sg.GlobalIlluminationQuality 0-3.", "Lumen: hardware ray tracing (r.Lumen.HardwareRayTracing 1); the tier is sg.GlobalIlluminationQuality and sg.ReflectionQuality 1-3, with each tier's own ray tracing lighting mode.", "Low: WindyGI Low keeps GI; Lumen Low has none (Lumen GI and distance-field AO off), so the Low column is the price of having GI at all.", "GI off, for the GI cost: WindyGI r.WindyGI.Enable 0 with DFAO off; Lumen r.Lumen.DiffuseIndirect.Allow 0 with DFAO and SSAO off."]}, {"h": "Images", "items": ["As played: auto exposure (histogram) in both engines. Tent views settle 25 s after the camera cut, the others 10 s.", "Fixed EV: one exposure per view, shared by every image and the path tracer (the SW sheet's exposures), so light levels compare directly.", "Path tracer: UE 5.8, 2048 samples per pixel, 8 bounces, the same look settings (the SW sheet's renders). It is shown for the four tent views only: outdoors its ray tracing scene misses the undergrowth and most of the canopy that both raster engines draw.", "WindyGI Low and Medium tent views were captured twice, in opposite orders (the world probe volume depends on where the camera came from): Medium differs by at most 0.09 stops between the two (v14), Low by 0.08-0.15 (v18 0.15, over the 0.13 limit)."]}, {"h": "Numbers", "items": ["FPS is 1000 divided by the mean frame time, so it averages the same way as the frame time.", "GI cost is the frame time with GI on minus the same package's frame time with GI off, per view: each process is paired with that engine's GI-off process from the same round of the session, and the pairs are averaged.", "GPU time and thread times are shown per engine, not compared across them: UE 5.8's GPU counter adds up only the time the GPU is busy, while UE 4.27's covers the whole GPU frame, gaps included. A view is marked CPU when the render thread's busy time (UE 5.8's render thread time minus its waits on other threads) or the game thread takes at least 90 % of the frame; the RHI thread is left out, as UE 4.27 counts its waits for the GPU there.", "The hardware ray tracing scene also costs CPU time in WindyGI (the render thread gathers it every frame), so CPU-bound views are marked rather than hidden.", "Render thread, in the corner labels and the tier cards: the render thread's busy time on the view (UE 5.8's RenderThreadTime minus its waits on other threads), the CPU side of the frame. VRAM: the peak dedicated video memory of the game process over the arm's run, from Windows' GPU Process Memory counter (one value per arm, not per view; runs before 10-08 have none)."]}], "foot": "WindyGI HW, branch 4.27-Soliz (0cee8223); package RT_88TG = 4.27-Soliz 0cee8223. Lumen package Lumen_1006b (GITest58). Generated 2026-10-09.", "noPT": "No path-traced reference here: the UE 5.8 path tracer's scene lacks this map's undergrowth and most of the canopy outdoors, so it would not be a fair reference.", "ptNotes": {"v18": "The path-traced v18 has the tent's lamps on; both raster images have them off, so judge the daylight away from the lamps."}, "ledgerLead": "Mean frame time over two processes per engine, interleaved in one session. Δ is WindyGI minus Lumen: green means WindyGI is faster. FPS is 1000 divided by the mean frame time. GI cost is GI on minus the same package with GI off, process by process in the same session.", "gpuLead": "Where each frame goes. GPU time and thread times compare within one engine only (see Numbers below). CPU marks a view where the render thread's busy time or the game thread takes at least 90 % of the frame."};
const $ = id => document.getElementById(id);
const TIERS = ['low', 'med', 'high', 'epic'];
const TN = { low: 'Low', med: 'Medium', high: 'High', epic: 'Epic' };
const TC = { low: 'L', med: 'M', high: 'H', epic: 'E' };
const CT = { L: 'low', M: 'med', H: 'high', E: 'epic' };
let S = { mode: 'pt', tier: 'med', view: null, left: 'PT', right: 'WM', table: 'ft', map: 'RT', gpu: D.gpus[0].id };
try { const k = JSON.parse(localStorage.getItem('wgi-hw-sheet2') || 'null'); if (k) S = Object.assign(S, k); } catch (e) {}
if (!TIERS.includes(S.tier)) S.tier = 'med';
if (!D.maps[S.map]) S.map = 'RT';
if (!D.gpus.some(g => g.id === S.gpu)) S.gpu = D.gpus[0].id;
if (!D.showGpu) { S.table = 'ft'; $('t-gpu').hidden = true; }
const GPU = () => D.gpus.find(g => g.id === S.gpu) || D.gpus[0];
const MAP = () => D.maps[S.map] || D.maps.RT;
const pre = () => S.map === 'RT' ? '' : S.map + '-';   // image names: Map_RT_Daylight's have no prefix
const rowsOf = t => (((((GPU().maps || {})[S.map]) || {}).tiers || {})[t]) || [];
const views = () => S.mode === 'pt' && MAP().fixed.length ? MAP().fixed : MAP().views;
const hasPT = v => D.files.includes(`${pre()}PT-${v}`);
const lname = t => `${D.labels.L} ${TN[t]}${t === 'low' ? ' (no GI)' : ''}`;
const wname = t => `${D.labels.W} ${TN[t]}`;
const label = s => s === 'PT' ? D.labels.PT : s[0] === 'W' ? wname(CT[s[1]]) : lname(CT[s[1]]);
const gname = () => `${GPU().name} · ${GPU().res}`;
function sources() {
  const out = S.mode === 'pt' && hasPT(S.view) ? ['PT'] : [];
  for (const t of TIERS) out.push('W' + TC[t], 'L' + TC[t]);
  return out;
}
function file(src, v) {
  const n = pre() + (src === 'PT' ? `PT-${v}` : S.mode === 'pt' ? `${src}-pt-${v}` : `${src}-${v}`);
  return D.files.includes(n) ? `img/${n}.webp` : null;
}
const fmt = (x, d = 2, sign) => x == null ? '–' : (sign && x > 0 ? '+' : '') + x.toFixed(d);
const chip = s => s && s.bound === 'CPU' ? ' <span class="chip" title="the render or game thread is busy for at least 90 % of the frame">CPU</span>' : '';
// A corner label: the source, then that source's own numbers on this view (its tier's kit row, so Lumen Medium against WindyGI High shows
// each side's own FPS): FPS and frame time, then the GI cost (GI on - GI off). The path tracer is an offline reference: no numbers.
function tag(src) {
  const name = `<span class="t1">${label(src)}</span>`;
  if (src === 'PT') return name + `<span class="t3">offline reference, not timed</span>`;
  const t = CT[src[1]], r = rowsOf(t).find(x => x.view === S.view), e = src[0] === 'W' ? 'w' : 'l';
  const s = r && r[e], gi = r ? r[e + '_gi'] : null;
  if (!s || s.ft == null) return name + `<span class="t3">${gname()}: not measured yet</span>`;
  const g = e === 'l' && t === 'low' ? 'no GI' : `GI <b>${fmt(gi)}</b> ms`;
  // the CPU side and the memory: the render thread's busy time on this view (UE 5.8's RenderThreadTime counts its waits, so the kit takes them off: 'rtb'),
  // and the process's peak dedicated VRAM over the arm's run (a Windows GPU Process Memory counter; runs from 10-08 on)
  const cpuv = s.rtb != null ? `render thread <b>${fmt(s.rtb)}</b> ms` : '', vr = s.vram_mb != null ? `VRAM <b>${fmt(s.vram_mb / 1024, 1)}</b> GB` : '';
  const l2 = [cpuv, vr].filter(Boolean).join(' · ');
  return name + `<span class="t2"><b>${fmt(1000 / s.ft, 1)}</b> FPS · ${fmt(s.ft)} ms · ${g}</span>` + (l2 ? `<span class="t2">${l2}</span>` : '') + `<span class="t3">${gname()}</span>`;
}
function setTier(t) {

function render() {
  try { localStorage.setItem('wgi-hw-sheet2', JSON.stringify(S)); } catch (e) {}
  if (S.mode === 'pt' && !MAP().fixed.length) S.mode = 'play';
  if (!views().includes(S.view)) S.view = views()[0];
  const src = sources();
  if (!src.includes(S.left)) S.left = 'L' + TC[S.tier];
  if (!src.includes(S.right) || S.right === S.left) S.right = 'W' + TC[S.tier];
  $('maps').innerHTML = Object.entries(D.maps).map(([k, m]) => `<button type="button" data-map="${k}" aria-pressed="${k === S.map}">${m.label}</button>`).join('');
  $('gpus').innerHTML = D.gpus.map(g => `<button type="button" data-gpu="${g.id}" aria-pressed="${g.id === S.gpu}">${g.name} · ${g.res}</button>`).join('');
  $('rig').innerHTML = `Test machine: <b>${GPU().machine}</b>`;
  $('tiers').innerHTML = TIERS.map(t => `<button type="button" data-tier="${t}" aria-pressed="${t === S.tier}">${TN[t]}</button>`).join('');
  $('m-pt').setAttribute('aria-pressed', S.mode === 'pt'); $('m-play').setAttribute('aria-pressed', S.mode === 'play');
  $('t-ft').setAttribute('aria-pressed', S.table === 'ft'); $('t-gpu').setAttribute('aria-pressed', S.table === 'gpu');
  for (const [id, key] of [['left', 'left'], ['right', 'right']])
    $(id).innerHTML = src.map(s => `<option value="${s}" ${S[key] === s ? 'selected' : ''}>${label(s)}</option>`).join('');
  const a = file(S.left, S.view), b = file(S.right, S.view);
  $('missing').hidden = !!(a && b);
  if (a) $('imgL').src = a; else $('imgL').removeAttribute('src');
  if (b) $('imgR').src = b; else $('imgR').removeAttribute('src');
  $('tagL').innerHTML = tag(S.left); $('tagR').innerHTML = tag(S.right);
  const ev = (MAP().ev || {})[S.view];
  const r = rowsOf(S.tier).find(x => x.view === S.view);
  let perf = `<span class="muted">${gname()}: no numbers for ${TN[S.tier]} yet</span>`;
  if (r && r.w && r.l) {
    perf = `<span>${gname()}: ${wname(S.tier)} <b class="num">${fmt(r.w.ft)}</b> ms (<b class="num">${fmt(r.w.fps, 1)}</b> fps)${chip(r.w)} · ` +
      `${lname(S.tier)} <b class="num">${fmt(r.l.ft)}</b> ms (<b class="num">${fmt(r.l.fps, 1)}</b> fps)${chip(r.l)} · ` +
      `<b class="num ${r.d < 0 ? 'good' : 'bad'}">${fmt(r.d, 2, true)}</b> ms</span>` +
      `<span>GI cost: WindyGI <b class="num">${fmt(r.w_gi)}</b> ms · Lumen <b class="num">${S.tier === 'low' ? '–' : fmt(r.l_gi)}</b> ms</span>`;
  }
  const ptn = S.mode === 'pt' && hasPT(S.view) && (S.left === 'PT' || S.right === 'PT') ? (D.ptNotes || {})[S.view] : '';
  $('readout').innerHTML = `<span class="num"><b>${S.view}</b></span>` +
    (S.mode === 'pt' && ev != null ? `<span>Exposure fixed at <b class="num">EV ${ev}</b> for every image</span>` : `<span>Auto exposure, as played</span>`) +
    (S.mode === 'pt' && !hasPT(S.view) ? `<span class="muted">${D.noPT}</span>` : '') + (ptn ? `<span class="muted">${ptn}</span>` : '') + perf;
  $('strip').innerHTML = views().map(v => {
    const t = file('W' + TC[S.tier], v) || file('L' + TC[S.tier], v) || file('WM', v);
    return `<button class="thumb" role="listitem" type="button" data-v="${v}" aria-current="${v === S.view}">` +
      (t ? `<img loading="lazy" src="${t}" alt="">` : '') + `<span>${v}</span>` + (hasPT(v) ? '<b class="pt">PT</b>' : '') + `</button>`;
  }).join('');
  verdicts(); ledger();
}

function gmean(rows, f) { const a = rows.map(f).filter(x => x != null); return a.length ? a.reduce((s, x) => s + x, 0) / a.length : null; }
function stats(t) {
  const rows = rowsOf(t).filter(r => r.w && r.l);
  if (!rows.length) return null;
  const ds = rows.map(r => r.w.ft - r.l.ft), k = ds.indexOf(Math.max(...ds));
  return { n: rows.length, faster: ds.filter(d => d < 0).length, mean: gmean(rows, r => r.w.ft - r.l.ft), worst: ds[k], worstView: rows[k].view,
           wfps: 1000 / gmean(rows, r => r.w.ft), lfps: 1000 / gmean(rows, r => r.l.ft), wgi: gmean(rows, r => r.w_gi), lgi: gmean(rows, r => r.l_gi),
           wcpu: rows.filter(r => r.w.bound === 'CPU').length, lcpu: rows.filter(r => r.l.bound === 'CPU').length,
           wrt: gmean(rows, r => r.w.rtb), lrt: gmean(rows, r => r.l.rtb), wvram: gmean(rows, r => r.w.vram_mb), lvram: gmean(rows, r => r.l.vram_mb) };
}
function verdicts() {
  $('verdicts').innerHTML = TIERS.map(t => {
    const s = stats(t), nt = (D.verdictNotes || {})[t] || '', sel = t === S.tier;
    const k = `${TN[t]} · ${D.labels.W} against ${lname(t)}`;
    if (!s) return `<button type="button" class="verdict" data-tier="${t}" aria-pressed="${sel}"><span class="small">${k}</span><span class="big">–</span><span class="small">not measured yet</span></button>`;
    const cpu = s.wcpu || s.lcpu ? ` · CPU-bound views: WindyGI ${s.wcpu}, Lumen ${s.lcpu}` : '';
    const fps = `<span class="fps">WindyGI <b>${fmt(s.wfps, 1)}</b> fps · Lumen <b>${fmt(s.lfps, 1)}</b> fps</span>` +
      `<span class="fps">GI cost: WindyGI <b>${fmt(s.wgi)}</b> ms · Lumen <b>${t === 'low' ? '–' : fmt(s.lgi)}</b> ms</span>` +
      `<span class="fps">CPU render thread: WindyGI <b>${fmt(s.wrt)}</b> ms · Lumen <b>${fmt(s.lrt)}</b> ms</span>` +
      (s.wvram != null && s.lvram != null ? `<span class="fps">VRAM: WindyGI <b>${fmt(s.wvram / 1024, 1)}</b> GB · Lumen <b>${fmt(s.lvram / 1024, 1)}</b> GB</span>` : '');
    if (t === 'low')
      return `<button type="button" class="verdict" data-tier="${t}" aria-pressed="${sel}"><span class="small">${k} · WindyGI Low keeps GI, Lumen Low has none</span>` +
        `<span class="big">${fmt(s.mean, 2, true)} ms for GI</span>${fps}<span class="small">mean over ${s.n} views · faster at ${s.faster} of ${s.n}${cpu}${nt ? ' · ' + nt : ''}</span></button>`;
    const cls = s.faster === s.n ? 'good' : s.faster < s.n / 2 ? 'bad' : '';
    return `<button type="button" class="verdict" data-tier="${t}" aria-pressed="${sel}"><span class="small">${k}</span>` +
      `<span class="big ${cls}">${s.faster} / ${s.n} views faster</span>${fps}` +
      `<span class="small">mean ${fmt(s.mean, 2, true)} ms, closest ${fmt(s.worst, 2, true)} ms (${s.worstView})${cpu}${nt ? ' · ' + nt : ''}</span></button>`;
  }).join('');
}

function dcell(x, m) {
  if (x == null) return '<td>–</td>';
  const w = Math.min(50, Math.abs(x) / m * 50);
  const style = x < 0 ? `right:50%;width:${w}%;background:var(--faster)` : `left:50%;width:${w}%;background:var(--slower)`;
  return `<td><span class="delta"><span class="${x < 0 ? 'good' : 'bad'}">${fmt(x, 2, true)}</span><span class="bar"><i style="${style}"></i></span></span></td>`;
}
function pct(w, l) { if (w == null || l == null) return '<td>–</td>'; const x = (w / l - 1) * 100; return `<td class="${x > 0 ? 'good' : 'bad'}">${fmt(x, 1, true)} %</td>`; }
function ledger() {
  const rows = rowsOf(S.tier), ok = rows.filter(r => r.w && r.l);
  $('h-ledger').textContent = `${MAP().label} · ${gname()} · ${TN[S.tier]}`;
  const tn = (D.tierNotes || {})[S.tier] || '';
  $('ledger-lead').innerHTML = `${GPU().machine}. ${S.table === 'ft' ? D.ledgerLead : D.gpuLead} ${tn}${GPU().note ? ' ' + GPU().note : ''}`;
  if (!ok.length) { $('ledger').innerHTML = `<div class="pending">No numbers for ${MAP().label} at ${TN[S.tier]} on the ${GPU().name} yet.</div>`; return; }
  const lt = lname(S.tier);
  if (S.table === 'gpu') {
    const g = (s, k) => s ? fmt(s[k]) : '–';
    const row = (name, w, l, sum) => `<tr${sum ? ' class="sum"' : ''}><td>${name}</td>` +
      `<td class="grp">${g(w, 'ft')}</td><td>${g(w, 'gpu')}</td><td>${g(w, 'rtb')}</td><td>${g(w, 'gt')}</td><td>${g(w, 'rhi')}</td><td>${w && w.bound ? (w.bound === 'CPU' ? chip(w) : 'GPU') : ''}</td>` +
      `<td class="grp">${g(l, 'ft')}</td><td>${g(l, 'gpu')}</td><td>${g(l, 'rtb')}</td><td>${g(l, 'gt')}</td><td>${g(l, 'rhi')}</td><td>${l && l.bound ? (l.bound === 'CPU' ? chip(l) : 'GPU') : ''}</td></tr>`;
    const mean = e => { const o = {}; for (const k of ['ft', 'gpu', 'rtb', 'gt', 'rhi']) o[k] = gmean(ok, r => r[e][k]); return o; };
    const hd = '<th class="grp">frame</th><th>GPU</th><th>render, busy</th><th>game</th><th>RHI</th><th>bound</th>';
    $('ledger').innerHTML = `<table><thead><tr><th></th><th class="grp" colspan="6">${wname(S.tier)} (UE 4.27), ms</th><th class="grp" colspan="6">${lt} (UE 5.8), ms</th></tr>` +
      `<tr><th>View</th>${hd}${hd}</tr></thead><tbody>` +
      rows.map(r => row(r.view, r.w, r.l)).join('') + row('mean', mean('w'), mean('l'), true) + `</tbody></table>`;
    return;
  }
  const m = Math.max(0.5, ...TIERS.flatMap(t => rowsOf(t).filter(r => r.w && r.l).map(r => Math.abs(r.w.ft - r.l.ft))));
  const row = (name, wft, lft, wgi, lgi, w, l, sum) =>
    `<tr${sum ? ' class="sum"' : ''}><td>${name}</td><td class="grp">${fmt(wft)}${chip(w)}</td><td>${fmt(lft)}${chip(l)}</td>${dcell(wft != null && lft != null ? wft - lft : null, m)}` +
    `<td class="grp">${fmt(wft ? 1000 / wft : null, 1)}</td><td>${fmt(lft ? 1000 / lft : null, 1)}</td>${pct(wft ? 1000 / wft : null, lft ? 1000 / lft : null)}` +
    `<td class="grp">${fmt(wgi)}</td><td>${fmt(lgi)}</td>${dcell(wgi != null && lgi != null ? wgi - lgi : null, m)}</tr>`;
  $('ledger').innerHTML = `<table><thead><tr><th></th><th class="grp" colspan="3">Frame time, ms</th><th class="grp" colspan="3">FPS</th>` +
    `<th class="grp" colspan="3">GI cost, ms (GI on - GI off)</th></tr>` +
    `<tr><th>View</th><th class="grp">WindyGI</th><th>${lt}</th><th>Δ</th><th class="grp">WindyGI</th><th>${lt}</th><th>Δ</th>` +
    `<th class="grp">WindyGI</th><th>Lumen</th><th>Δ</th></tr></thead><tbody>` +
    rows.map(r => row(r.view, r.w && r.w.ft, r.l && r.l.ft, r.w_gi, r.l_gi, r.w, r.l)).join('') +
    row('mean', gmean(ok, r => r.w.ft), gmean(ok, r => r.l.ft), gmean(ok, r => r.w_gi), gmean(ok, r => r.l_gi), null, null, true) + `</tbody></table>`;
}

$('maps').onclick = e => { const b = e.target.closest('button'); if (b) { S.map = b.dataset.map; S.view = null; setTier(S.tier); } };
$('gpus').onclick = e => { const b = e.target.closest('button'); if (b) { S.gpu = b.dataset.gpu; render(); } };
$('tiers').onclick = e => { const b = e.target.closest('button'); if (b) setTier(b.dataset.tier); };
$('verdicts').onclick = e => { const b = e.target.closest('.verdict'); if (b) setTier(b.dataset.tier); };
$('m-pt').onclick = () => { S.mode = 'pt'; if (!views().includes(S.view)) S.view = views()[0]; S.left = hasPT(S.view) ? 'PT' : 'L' + TC[S.tier]; render(); };
$('m-play').onclick = () => { S.mode = 'play'; if (S.left === 'PT') S.left = 'L' + TC[S.tier]; render(); };
$('t-ft').onclick = () => { S.table = 'ft'; render(); };
$('t-gpu').onclick = () => { S.table = 'gpu'; render(); };
$('left').onchange = e => { S.left = e.target.value; if (S.left === S.right) S.right = sources().find(s => s !== S.left); render(); };
$('right').onchange = e => { S.right = e.target.value; if (S.left === S.right) S.left = sources().find(s => s !== S.right); render(); };
$('strip').onclick = e => { const b = e.target.closest('.thumb'); if (b) { S.view = b.dataset.v; if (S.mode === 'pt' && hasPT(S.view) && S.left !== 'PT' && S.right !== 'PT') S.left = 'PT'; render(); } };
$('cut').oninput = e => $('stage').style.setProperty('--cut', e.target.value + '%');
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const vs = views(), i = vs.indexOf(S.view);
  if (e.key === ']' || e.key === 'PageDown') { S.view = vs[(i + 1) % vs.length]; render(); }
  if (e.key === '[' || e.key === 'PageUp') { S.view = vs[(i - 1 + vs.length) % vs.length]; render(); }
});
if (D.banner) { $('banner').hidden = false; $('banner').textContent = D.banner; }
$('eyebrow').textContent = D.eyebrow; $('h1').textContent = D.h1;
$('lead').innerHTML = D.lead;
$('howto').textContent = 'Drag across the image to move the divider. Any two sources, any tiers. [ and ] step through the views. A verdict tile picks its tier.';
$('notes').innerHTML = D.notes.map(n => `<div><h3>${n.h}</h3><ul>${n.items.map(i => `<li>${i}</li>`).join('')}</ul></div>`).join('');
$('foot').innerHTML = D.foot;
render();
</script>

</html>
